name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Unique group: pages.yml uses the generic "pages" group too, and the two
  # workflows cancelled each other on every push, starving both deploys.
  group: pages-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Kept as a plain environment name: the Cloudflare token may be stored as an
    # environment secret, and a job that does not declare the environment cannot
    # see one. The page_url output used to be published here, but it is empty on
    # every run that skips the deploy, and an environment url that resolves to
    # nothing is worse than no url - Cloudflare's own GitHub integration already
    # reports the preview URL on its own check.
    environment: cloudflare-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Cloudflare Pages step is optional: Cloudflare's own GitHub
      # integration publishes chalkle.lootline.xyz on every push to main, so
      # this workflow must be able to do nothing and still report success.
      #
      # The gate has to read the secret through `env`, NOT inline in an `if`.
      # `secrets` is not an available context in a step-level `if`, so
      # `if: ${{ secrets.X != '' }}` makes the whole workflow invalid and every
      # run dies instantly with zero jobs - a red X on every push, with no
      # annotation to explain it. Env vars are allowed in `if`, so the check
      # happens in a shell step and the `if` compares a step output instead.
      - name: Check whether a Cloudflare token is configured
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is set - deploying deploy-static."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN secret is configured, so this run only"
            echo "reports status. Cloudflare's connected GitHub integration (the"
            echo "'Cloudflare Pages' check) still publishes chalkle.lootline.xyz"
            echo "on every push to main."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.enabled == 'true'
        id: deployment
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '24daff7bc56afcdf6dbcb94e94460700'
          projectName: 'ixl-math-learning'
          directory: .
          workingDirectory: ./deploy-static
          branch: main

      - name: Purge jsDelivr mirrors
        run: |
          for repo in PrismDev3/chalkle PrismDev3/chalkle-auto; do
            curl -sS --max-time 60 "https://purge.jsdelivr.net/gh/$repo" >/dev/null || true
          done

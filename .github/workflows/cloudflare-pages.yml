name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# `contents: read` is for the checkout, `deployments: write` lets wrangler-action
# attach a GitHub Deployment to the run. No `pages:` or `id-token:` scopes: those
# belong to pages.yml, which publishes to GitHub Pages over OIDC and has nothing
# to do with this one.
permissions:
  contents: read
  deployments: write

concurrency:
  # Unique group: pages.yml uses the generic "pages" group too, and the two
  # workflows cancelled each other on every push, starving both deploys.
  group: pages-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Cloudflare Pages step is optional: Cloudflare's own GitHub
      # integration publishes chalkle.lootline.xyz on every push to main, so
      # this workflow must be able to do nothing and still report success.
      #
      # The gate has to read the secret through `env`, NOT inline in an `if`.
      # `secrets` is not an available context in a step-level `if`, so
      # `if: ${{ secrets.X != '' }}` made the whole workflow invalid and every
      # run died instantly with zero jobs. Env vars are allowed in `if`, so the
      # check runs in a shell step and the `if` compares a step output instead.
      - name: Check whether a Cloudflare token is configured
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is set - deploying deploy-static."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No CLOUDFLARE_API_TOKEN secret is configured, so this run only"
            echo "reports status. Cloudflare's connected GitHub integration (the"
            echo "'Cloudflare Pages' check) still publishes chalkle.lootline.xyz"
            echo "on every push to main."
          fi

      # cloudflare/pages-action is gone - the repository 404s and Cloudflare
      # directs everyone to wrangler-action, which does Pages. It is not a
      # cosmetic swap: GitHub resolves every `uses:` while setting the job up,
      # so the dead reference failed the job before the first step ran, which is
      # why this workflow had never once deployed anything.
      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account that owns the Pages projects. Not a secret, and hardcoded
          # here the way scripts/deploy-all-pages.sh hardcodes it.
          accountId: '24daff7bc56afcdf6dbcb94e94460700'
          # Direct upload of the prebuilt tree: deploy-static is the drag-and-drop
          # publish directory, so no build step runs here.
          command: pages deploy deploy-static --project-name=ixl-math-learning --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Purge jsDelivr mirrors
        run: |
          for repo in PrismDev3/chalkle PrismDev3/chalkle-auto; do
            curl -sS --max-time 60 "https://purge.jsdelivr.net/gh/$repo" >/dev/null || true
          done

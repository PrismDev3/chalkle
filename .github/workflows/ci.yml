name: CI

# Every gate the repo ships (syntax, audits, unit suites, the SW policy pin,
# and the two headless-Chrome harnesses), so a broken push to main is caught
# BEFORE the two deploy workflows publish it. Python gates use whatever
# python3 the runner has; there is no packaging to install anywhere.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Deploys cancel each other per-group; CI just needs one run per ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The two CDP harnesses (sweep-views, surprise-e2e) drive a real browser.
      # ubuntu-latest ships google-chrome-stable; chromium is the fallback.
      - name: Locate Chrome for the headless harnesses
        run: |
          for c in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "CHALKLE_CHROME=$(command -v "$c")" >> "$GITHUB_ENV"
              echo "using: $c"
              break
            fi
          done

      # Serve from the repo root so relative URLs behave like production.
      - name: Start Chalkle server
        run: |
          (python3 server/serve-chalk.py > /tmp/chalkle-server.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null 2>&1; then
              echo "server is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::server did not come up on :4173"
          cat /tmp/chalkle-server.log
          exit 1

      # One shell, no set -e: every gate reports, the summary tallies.
      - name: Run all quality gates
        run: |
          gates=(
            "syntax:node --check src/app.js && node --check deploy-static/src/app.js"
            "sw-unit:node tools/sw-test.js"
            "surprise-unit:node tools/surprise-test.js"
            "sw-policy:node scripts/sw-policy-check.mjs sw.js"
            "audit:node scripts/audit.mjs"
            "checker:python3 tools/checker.py"
            "ai-relay:python3 tools/ai-relay-test.py"
            "cloud-art:python3 tools/cloud-art-test.py"
            "plays:python3 tools/plays-test.py"
            "playtime:node tools/playtime-test.js"
            "sweep-views:node scripts/sweep-views.mjs"
            "surprise-e2e:node scripts/surprise-e2e.mjs"
          )
          failed=0
          : > /tmp/gate-results.txt
          for gate in "${gates[@]}"; do
            name="${gate%%:*}"; cmd="${gate#*:}"
            echo "::group::gate: $name"
            echo "\$ $cmd"
            if eval "$cmd"; then
              echo "PASS  $name" >> /tmp/gate-results.txt
            else
              echo "FAIL  $name" >> /tmp/gate-results.txt
              echo "::error::gate failed: $name"
              failed=1
            fi
            echo "::endgroup::"
          done
          cat /tmp/gate-results.txt
          # The deploy-static mirror must stay byte-identical to the source
          # tree: deploys publish that directory, and drift = stale site.
          for f in src/app.js index.html sw.js; do
            if ! cmp -s "$f" "deploy-static/$f"; then
              echo "::error::deploy-static/$f has drifted from $f - run the mirror/sync step"
              failed=1
            fi
          done
          exit "$failed"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Chalkle CI gates"
            echo '```'
            cat /tmp/gate-results.txt 2>/dev/null || echo "(no results)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

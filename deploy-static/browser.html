<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Chalkle Browser</title>
<script src="src/theme.js"></script>
<link rel="icon" href="favicon.svg">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0c0a;
    --bg-elevated: #14120f;
    --surface: #1a1815;
    --surface-hover: #211e1a;
    --surface-active: #28241f;
    --border: #2b2823;
    --border-soft: #201e1a;
    --border-strong: #3e3930;
    --text: #ece9e1;
    --text-2: #a7a196;
    --text-3: #7b7568;
    --accent: #4cc56f;
    --accent-soft: rgba(76, 197, 111, 0.13);
    --danger: #ff5c4d;
    --danger-soft: rgba(255, 92, 77, 0.13);
    --radius-sm: 6px;
    --radius: 9px;
    --radius-lg: 14px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --display-geo: "Space Grotesk", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
    --ease: cubic-bezier(0.2, 0.65, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; }
  .bk {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--bg);
  }

  /* ---------- Chrome ---------- */
  .bk-chrome {
    flex: none;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
  }

  /* Tab bar */
  .bk-tabbar {
    display: flex;
    align-items: stretch;
    gap: 4px;
    padding: 6px 8px 0;
    min-height: 40px;
  }
  .bk-tabs {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .bk-tabs::-webkit-scrollbar { display: none; }
  .bk-tab {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex: 0 1 190px;
    min-width: 96px;
    max-width: 210px;
    height: 33px;
    padding: 0 6px 0 10px;
    border: 1px solid transparent;
    border-bottom: 0;
    border-radius: 8px 8px 0 0;
    background: transparent;
    color: var(--text-2);
    font-size: 12.5px;
    cursor: pointer;
    transition: background var(--dur, 120ms) var(--ease), color var(--dur, 120ms) var(--ease), border-color var(--dur, 120ms) var(--ease);
  }
  .bk-tab:hover { background: var(--surface); color: var(--text); }
  .bk-tab.is-active {
    background: var(--surface);
    border-color: var(--border);
    color: var(--text);
  }
  .bk-tab-fav {
    display: grid;
    place-items: center;
    width: 16px;
    height: 16px;
    flex: none;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    color: #0d0c0a;
    user-select: none;
  }
  .bk-tab.is-loading .bk-tab-fav {
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    border-top-color: var(--accent);
    animation: bkSpin 0.8s linear infinite;
  }
  .bk-tab-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bk-tab-x {
    display: grid;
    place-items: center;
    width: 18px;
    height: 18px;
    flex: none;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    transition: background 120ms var(--ease), color 120ms var(--ease);
  }
  .bk-tab-x:hover { background: var(--surface-active); color: var(--text); }
  .bk-newtab {
    display: grid;
    place-items: center;
    width: 30px;
    height: 33px;
    flex: none;
    align-self: flex-end;
    margin-bottom: 1px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--text-2);
    cursor: pointer;
    font-size: 17px;
    transition: background 120ms var(--ease), color 120ms var(--ease);
  }
  .bk-newtab:hover { background: var(--surface); color: var(--text); }
  .bk-newtab svg { width: 15px; height: 15px; }

  /* Toolbar */
  .bk-toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
  }
  .bk-nav {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: none;
  }
  .bk-btn {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    flex: none;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--text-2);
    cursor: pointer;
    transition: background 120ms var(--ease), color 120ms var(--ease);
  }
  .bk-btn:hover:not(:disabled) { background: var(--surface); color: var(--text); }
  .bk-btn:disabled { opacity: 0.38; cursor: default; }
  .bk-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bk-home svg { width: 19px; height: 19px; }
  .bk-actions { display: flex; align-items: center; gap: 2px; flex: none; }

  /* Address bar */
  .bk-address {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 38px;
    padding: 0 6px 0 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    transition: border-color 120ms var(--ease), box-shadow 120ms var(--ease), background 120ms var(--ease);
  }
  .bk-address:hover { border-color: var(--border-strong); }
  .bk-address:focus-within {
    border-color: var(--accent);
    background: var(--surface-hover);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .bk-addr-ico { width: 15px; height: 15px; flex: none; color: var(--text-3); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .bk-addr-ico.is-editing { color: var(--accent); }
  .bk-addr {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13.5px;
    caret-color: var(--accent);
  }
  .bk-addr::placeholder { color: var(--text-3); font-family: var(--font); }
  .bk-go {
    flex: none;
    height: 26px;
    padding: 0 12px;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: #06240f;
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
    transition: filter 120ms var(--ease);
  }
  .bk-go:hover { filter: brightness(1.08); }
  .bk-go:active { filter: brightness(0.95); }

  /* Progress */
  .bk-progress {
    height: 2px;
    flex: none;
    overflow: hidden;
    background: transparent;
  }
  .bk-progress-bar {
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width 260ms var(--ease), opacity 200ms var(--ease);
  }

  /* ---------- Body ---------- */
  .bk-body { flex: 1; position: relative; min-height: 0; background: var(--bg); }
  .bk-viewport { position: absolute; inset: 0; }
  .bk-frame { width: 100%; height: 100%; border: 0; display: block; background: #fff; }

  /* New tab page */
  .bk-newtab-page {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    overflow-y: auto;
    text-align: center;
  }
  .bk-nt-logo {
    font-family: "Boogaloo", "Comic Sans MS", cursive;
    font-size: clamp(40px, 7vw, 58px);
    line-height: 1;
    letter-spacing: 0.01em;
    user-select: none;
  }
  .bk-nt-logo b { font-weight: 400; }
  .bk-nt-logo b:nth-child(1) { color: #ea4335; }
  .bk-nt-logo b:nth-child(2) { color: #f5b301; }
  .bk-nt-logo b:nth-child(3) { color: #4cc56f; }
  .bk-nt-logo b:nth-child(4) { color: #5b93ff; }
  .bk-nt-logo b:nth-child(5) { color: #f5b301; }
  .bk-nt-logo b:nth-child(6) { color: #4cc56f; }
  .bk-nt-logo b:nth-child(7) { color: #ea4335; }
  .bk-nt-tag { margin: 0; color: var(--text-2); font-size: 13.5px; }
  .bk-nt-addr { width: min(560px, 100%); }
  .bk-nt-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 560px; }
  .bk-nt-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 34px;
    padding: 0 13px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-2);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 120ms var(--ease), color 120ms var(--ease), background 120ms var(--ease), transform 120ms var(--ease);
  }
  .bk-nt-link:hover { border-color: var(--border-strong); color: var(--text); background: var(--surface-hover); transform: translateY(-1px); }
  .bk-nt-link svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bk-nt-note {
    margin-top: 2px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .bk-nt-resume {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 7px 13px;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text-2);
    font-size: 12.5px;
    cursor: pointer;
    transition: border-color 120ms var(--ease), color 120ms var(--ease);
  }
  .bk-nt-resume:hover { border-color: var(--accent); color: var(--accent); }
  .bk-nt-resume.show { display: inline-flex; }

  /* Blocked / error */
  .bk-blocked {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    z-index: 5;
  }
  .bk-blocked-card {
    max-width: 420px;
    width: 100%;
    padding: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    text-align: center;
    box-shadow: var(--shadow-pop, 0 18px 50px rgba(0, 0, 0, 0.5));
  }
  .bk-blocked-ico {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    margin: 0 auto 14px;
    border-radius: var(--radius);
    background: var(--danger-soft);
    color: var(--danger);
    font-family: var(--mono);
    font-weight: 700;
    font-size: 19px;
  }
  .bk-blocked-card h2 { margin: 0 0 6px; font-family: var(--display-geo); font-size: 19px; font-weight: 600; }
  .bk-blocked-card p { margin: 0 0 18px; color: var(--text-2); font-size: 13.5px; line-height: 1.5; }
  .bk-blocked-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
  .bk-bbtn {
    height: 34px;
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-hover);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 120ms var(--ease), background 120ms var(--ease), color 120ms var(--ease);
  }
  .bk-bbtn:hover { border-color: var(--border-strong); background: var(--surface-active); }
  .bk-bbtn.primary { border-color: var(--accent); background: var(--accent); color: #06240f; }
  .bk-bbtn.primary:hover { filter: brightness(1.08); }

  /* Fullscreen */
  .bk.fs .bk-chrome { display: none; }
  .bk-exitfs {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 20;
    height: 34px;
    padding: 0 14px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: rgba(20, 18, 15, 0.92);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 150ms var(--ease);
  }
  .bk.fs .bk-exitfs { opacity: 1; pointer-events: auto; }

  @keyframes bkSpin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    .bk-toolbar { gap: 5px; padding: 7px 8px; }
    .bk-nav { gap: 0; }
    .bk-btn { width: 32px; height: 32px; }
    .bk-address { padding-left: 10px; }
    .bk-go { display: none; }
    .bk-nt-links { gap: 6px; }
  }
  @media (max-width: 480px) {
    .bk-tab { flex-basis: 150px; min-width: 84px; }
    .bk-hide-mobile { display: none !important; }
  }
</style>
</head>
<body>
<div class="bk" id="bk">
  <div class="bk-chrome" id="bkChrome">
    <div class="bk-tabbar">
      <div class="bk-tabs" id="bkTabs" role="tablist" aria-label="Browser tabs"></div>
      <button class="bk-newtab" id="bkNewtab" type="button" title="New tab (Ctrl+T)" aria-label="New tab">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="bk-toolbar">
      <div class="bk-nav">
        <button class="bk-btn" id="bkBack" type="button" title="Back (Alt+Left)" aria-label="Back" disabled>
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="bk-btn bk-hide-mobile" id="bkFwd" type="button" title="Forward (Alt+Right)" aria-label="Forward" disabled>
          <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="bk-btn" id="bkReload" type="button" title="Reload (Ctrl+R)" aria-label="Reload">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg>
        </button>
      </div>
      <div class="bk-address" id="bkAddress">
        <svg class="bk-addr-ico" id="bkAddrIco" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="10.5" width="14" height="9" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>
        </svg>
        <input class="bk-addr" id="bkAddr" type="text" placeholder="Search or enter an address" autocomplete="off" spellcheck="false" aria-label="Address bar">
        <button class="bk-go" id="bkGo" type="button">Go</button>
      </div>
      <div class="bk-actions">
        <button class="bk-btn bk-hide-mobile" id="bkExt" type="button" title="Open in a new tab" aria-label="Open in a new tab">
          <svg viewBox="0 0 24 24"><path d="M7 17L17 7"/><path d="M9 7h8v8"/></svg>
        </button>
        <button class="bk-btn bk-home" id="bkHome" type="button" title="Back to Chalkle" aria-label="Back to Chalkle">
          <svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg>
        </button>
        <button class="bk-btn bk-hide-mobile" id="bkFs" type="button" title="Fullscreen" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4"/><path d="M20 9V5a1 1 0 0 0-1-1h-4"/><path d="M4 15v4a1 1 0 0 0 1 1h4"/><path d="M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="bk-progress" id="bkProgress"><div class="bk-progress-bar" id="bkProgressBar"></div></div>
  <div class="bk-body" id="bkBody">
    <div class="bk-viewport" id="bkViewport"></div>
    <div class="bk-newtab-page" id="bkNewtabPage">
      <div class="bk-nt-logo" aria-hidden="true"><b>c</b><b>h</b><b>a</b><b>l</b><b>k</b><b>l</b><b>e</b></div>
      <p class="bk-nt-tag">Search or type an address to browse.</p>
      <div class="bk-address bk-nt-addr" id="bkNtAddress">
        <svg class="bk-addr-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input class="bk-addr" id="bkNtAddr" type="text" placeholder="Search or enter an address" autocomplete="off" spellcheck="false" aria-label="Address or search">
        <button class="bk-go" id="bkNtGo" type="button">Go</button>
      </div>
      <div class="bk-nt-links" id="bkNtLinks"></div>
      <button class="bk-nt-resume" id="bkResume" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-4.9"/><path d="M20 12a8 8 0 0 1-14 4.9"/><path d="M18 3v4h-4"/><path d="M6 21v-4h4"/></svg>
        <span id="bkResumeLabel">Resume last page</span>
      </button>
      <div class="bk-nt-note">everything here runs through chalkle&rsquo;s built-in proxy</div>
    </div>
    <div class="bk-blocked" id="bkBlocked" hidden>
      <div class="bk-blocked-card">
        <div class="bk-blocked-ico" aria-hidden="true">!</div>
        <h2>Page unavailable</h2>
        <p id="bkBlockedMsg">This page couldn&rsquo;t be reached from here. It may be blocking embedded play, or the proxy route isn&rsquo;t available on this network.</p>
        <div class="bk-blocked-actions">
          <button class="bk-bbtn" id="bkBlockedBack" type="button">Back</button>
          <button class="bk-bbtn" id="bkBlockedReload" type="button">Reload</button>
          <button class="bk-bbtn primary" id="bkBlockedExt" type="button">Open in new tab</button>
        </div>
      </div>
    </div>
  </div>
  <button class="bk-exitfs" id="bkExitFs" type="button">Exit fullscreen</button>
</div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var bk = $("bk"), tabsEl = $("bkTabs"), viewport = $("bkViewport");
  var addr = $("bkAddr"), addrIco = $("bkAddrIco"), goBtn = $("bkGo");
  var ntAddr = $("bkNtAddr"), ntGo = $("bkNtGo"), ntPage = $("bkNewtabPage");
  var backBtn = $("bkBack"), fwdBtn = $("bkFwd"), reloadBtn = $("bkReload");
  var extBtn = $("bkExt"), homeBtn = $("bkHome"), fsBtn = $("bkFs"), exitFsBtn = $("bkExitFs");
  var progressBar = $("bkProgressBar"), blocked = $("bkBlocked");
  var blockedMsg = $("bkBlockedMsg"), blockedBack = $("bkBlockedBack"), blockedReload = $("bkBlockedReload"), blockedExt = $("bkBlockedExt");
  var resumeBtn = $("bkResume"), resumeLabel = $("bkResumeLabel");
  var embedded = window.parent !== window;

  /* Same base64url encoding the site launcher uses for /uv/ routes. */
  function b64url(s) {
    try { return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
    catch (e) { return ""; }
  }
  function proxied(url) {
    return location.origin + "/uv/" + b64url(url);
  }
  function unproxied(pu) {
    try {
      var m = String(pu || "").match(/\/uv\/([A-Za-z0-9_-]+)$/);
      if (!m) return pu;
      return atob(m[1].replace(/-/g, "+").replace(/_/g, "/"));
    } catch (e) { return pu; }
  }
  function looksUrl(t) {
    if (/^(https?:|ftp:)\/\//i.test(t)) return true;
    if (/^[a-z0-9-]+(\.[a-z0-9-]+)+(:[0-9]+)?(\/.*)?$/i.test(t) && t.indexOf(" ") === -1) return true;
    if (/^localhost(:\d+)?(\/.*)?$/i.test(t)) return true;
    return false;
  }
  function resolveUrl(input) {
    var t = (input || "").trim();
    if (!t) return null;
    if (/^(https?:|ftp:)\/\//i.test(t)) return t;
    if (t.indexOf("://") !== -1) return t; /* other schemes: pass through */
    if (looksUrl(t)) return "https://" + t;
    return "https://www.google.com/search?q=" + encodeURIComponent(t);
  }
  function hostOf(u) {
    try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u || ""; }
  }
  function cleanUrl(u) { return String(u || "").replace(/^https?:\/\//, "").replace(/\/$/, ""); }
  function letterOf(u) {
    var h = hostOf(u);
    return (h.charAt(0) || "?").toUpperCase();
  }
  var FAV_COLORS = ["#ea4335", "#f5b301", "#4cc56f", "#5b93ff", "#a06bff", "#23b8a5", "#e6438f", "#ff9d3c"];
  function favColor(u) {
    var h = hostOf(u);
    var n = 0;
    for (var i = 0; i < h.length; i++) n = (n * 31 + h.charCodeAt(i)) % 997;
    return FAV_COLORS[n % FAV_COLORS.length];
  }

  /* ---------- Sessions ---------- */
  var sessions = [];   /* {id, title, url, letter, color, hist:[], hi, frame, el, loading, failed} */
  var activeId = null;
  var nextId = 1;
  var loadTimer = null;
  var MAX_TABS = 8;

  function active() {
    for (var i = 0; i < sessions.length; i++) if (sessions[i].id === activeId) return sessions[i];
    return null;
  }

  function renderTabs() {
    var html = "";
    sessions.forEach(function (s) {
      html += '<div class="bk-tab' + (s.id === activeId ? " is-active" : "") + (s.loading ? " is-loading" : "") +
        '" role="tab" tabindex="0" data-bk-tab="' + s.id + '">' +
        '<span class="bk-tab-fav" style="background:' + s.color + '">' + escapeHtml(s.letter) + "</span>" +
        '<span class="bk-tab-title">' + escapeHtml(s.title || "New tab") + "</span>" +
        '<button class="bk-tab-x" data-bk-close="' + s.id + '" type="button" aria-label="Close tab" title="Close (Ctrl+W)">&times;</button></div>';
    });
    tabsEl.innerHTML = html;
    backBtn.disabled = !canBack();
    fwdBtn.disabled = !canFwd();
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function showNt() { ntPage.hidden = false; }
  function hideNt() { ntPage.hidden = true; }

  function syncView() {
    var s = active();
    sessions.forEach(function (x) {
      if (x.frame) x.frame.style.display = x.id === activeId ? "block" : "none";
    });
    if (s && !s.url) showNt(); else hideNt();
    if (s && s.failed) showBlocked(s); else hideBlocked();
    renderTabs();
    var cur = s && s.url ? cleanUrl(s.url) : "";
    if (document.activeElement !== addr && document.activeElement !== ntAddr) {
      addr.value = cur;
      addrIco.classList.toggle("is-editing", false);
    }
    document.title = (s && s.title ? s.title + " \u2014 " : "") + "Chalkle Browser";
    if (!s) return;
    /* keep the active tab visible in the strip */
    var el = tabsEl.querySelector('[data-bk-tab="' + s.id + '"]');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  function setActive(id) {
    if (id === activeId) return;
    activeId = id;
    syncView();
  }

  function newTab() {
    if (sessions.length >= MAX_TABS) return null;
    var s = { id: nextId++, title: "New tab", url: "", letter: "?", color: "#3e3930", hist: [], hi: -1, frame: null, el: null, loading: false, failed: false };
    sessions.push(s);
    activeId = s.id;
    syncView();
    focusAddr();
    return s;
  }

  function closeTab(id) {
    var i = -1;
    for (var k = 0; k < sessions.length; k++) if (sessions[k].id === id) { i = k; break; }
    if (i === -1) return;
    var s = sessions[i];
    if (s.frame && s.frame.parentNode) s.frame.parentNode.removeChild(s.frame);
    sessions.splice(i, 1);
    if (sessions.length === 0) { newTab(); return; }
    if (activeId === id) activeId = sessions[Math.min(i, sessions.length - 1)].id;
    syncView();
  }

  function ensureFrame(s) {
    if (!s.frame) {
      var f = document.createElement("iframe");
      f.className = "bk-frame";
      f.title = "Browser tab";
      f.setAttribute("allow", "fullscreen; autoplay; clipboard-read; clipboard-write; picture-in-picture");
      f.setAttribute("allowfullscreen", "");
      f.referrerPolicy = "no-referrer";
      f.addEventListener("load", function () { onFrameLoad(s); });
      viewport.appendChild(f);
      s.frame = f;
    }
    return s.frame;
  }

  function startLoading(s) {
    s.loading = true;
    s.failed = false;
    hideBlocked();
    progressBar.style.width = "0";
    progressBar.style.opacity = "1";
    requestAnimationFrame(function () { progressBar.style.width = "72%"; });
    if (loadTimer) clearTimeout(loadTimer);
    loadTimer = setTimeout(function () {
      if (!s.loading) return;
      s.loading = false;
      s.failed = true;
      syncView();
      progressBar.style.width = "100%";
      setTimeout(function () { progressBar.style.opacity = "0"; }, 250);
    }, 12000);
    renderTabs();
  }

  function finishLoading(s) {
    if (!s.loading) return;
    s.loading = false;
    if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
    progressBar.style.width = "100%";
    setTimeout(function () { progressBar.style.opacity = "0"; }, 250);
    renderTabs();
  }

  function onFrameLoad(s) {
    finishLoading(s);
    try {
      var f = s.frame.contentWindow;
      var doc = f.document;
      var t = doc && doc.title;
      /* The proxy returns a same-origin error page for unreachable targets -
         surface it as the Chalkle error state instead of a raw 502. */
      if (t === "Proxy error" || (doc && doc.body && /proxy couldn't load/i.test(String(doc.body.textContent || "")))) {
        s.failed = true;
        syncView();
        return;
      }
      var href = f.location.href;
      if (href && href !== "about:blank") {
        var real = unproxied(href) || href;
        s.url = real;
        if (!s.title || s.title === "New tab") s.title = hostOf(real) || real;
        syncView();
      }
      if (t && t !== "New tab") s.title = t;
    } catch (e) { /* cross-origin - keep provided title */ }
  }

  function navigate(url, opts) {
    opts = opts || {};
    var u = String(url || "").trim();
    if (!u) return;
    if (/^(blob:|data:|javascript:|about:)/i.test(u)) {
      if (u === "about:blank") return;
    }
    var s = active();
    if (!s) return;
    /* current: address-bar navigation stays in the active tab (like a real
       browser). Opening content (quick links) creates a new tab. */
    var fresh = !s.url && !s.frame && s.hi === -1;
    if (!opts.current && !fresh) {
      s = newTab();
      if (!s) return;
    }
    s.title = opts.title || hostOf(u) || "New tab";
    s.letter = letterOf(u);
    s.color = favColor(u);
    s.hist = s.hist.slice(0, s.hi + 1);
    s.hist.push(u);
    s.hi = s.hist.length - 1;
    s.url = u;
    ensureFrame(s);
    var target = proxied(u);
    startLoading(s);
    s.frame.src = target;
    hideNt();
    syncView();
    try { localStorage.setItem("chalkle-browser-last", u); } catch (e) { /* no storage */ }
  }

  function canBack() { var s = active(); return !!(s && s.hi > 0); }
  function canFwd() { var s = active(); return !!(s && s.hi < s.hist.length - 1); }
  function back() {
    var s = active();
    if (!s || !canBack()) return;
    s.hi--; s.url = s.hist[s.hi]; s.failed = false; hideBlocked();
    ensureFrame(s);
    startLoading(s);
    s.frame.src = proxied(s.url);
    syncView();
  }
  function forward() {
    var s = active();
    if (!s || !canFwd()) return;
    s.hi++; s.url = s.hist[s.hi]; s.failed = false; hideBlocked();
    ensureFrame(s);
    startLoading(s);
    s.frame.src = proxied(s.url);
    syncView();
  }
  function reload() {
    var s = active();
    if (!s || !s.url) return;
    s.failed = false;
    hideBlocked();
    ensureFrame(s);
    startLoading(s);
    s.frame.src = proxied(s.url);
    syncView();
  }

  /* ---------- Blocked / error ---------- */
  function showBlocked(s) {
    blocked.hidden = false;
    if (s && s.url) blockedMsg.textContent = "We couldn\u2019t reach " + hostOf(s.url) + " from here. It may be blocking embedded play, or the proxy route isn\u2019t available on this network.";
  }
  function hideBlocked() { blocked.hidden = true; }

  /* ---------- Address helpers ---------- */
  function focusAddr() {
    addr.focus();
    addr.select();
  }
  function submitFromBar(v) {
    var u = resolveUrl(v);
    if (!u) return;
    navigate(u, { current: true });
  }
  addr.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); submitFromBar(addr.value); }
  });
  goBtn.addEventListener("click", function () { submitFromBar(addr.value); });
  ntAddr.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); submitFromBar(ntAddr.value); }
  });
  ntGo.addEventListener("click", function () { submitFromBar(ntAddr.value); });
  addr.addEventListener("focus", function () { addr.select(); addrIco.classList.add("is-editing"); });
  addr.addEventListener("blur", function () { addrIco.classList.remove("is-editing"); });
  addr.addEventListener("input", function () { addrIco.classList.toggle("is-editing", !!addr.value); });

  backBtn.addEventListener("click", back);
  fwdBtn.addEventListener("click", forward);
  reloadBtn.addEventListener("click", reload);

  extBtn.addEventListener("click", function () {
    var s = active();
    if (!s || !s.url) return;
    var win = window.open(s.url, "_blank");
    if (win) { try { win.opener = null; } catch (e) { /* ignore */ } }
  });

  function backToChalkle() {
    if (embedded) {
      try { window.parent.postMessage({ chalkle: "close-browser" }, "*"); } catch (e) { /* ignore */ }
      return;
    }
    location.href = "/";
  }
  homeBtn.addEventListener("click", backToChalkle);

  blockedBack.addEventListener("click", back);
  blockedReload.addEventListener("click", reload);
  blockedExt.addEventListener("click", function () {
    var s = active();
    if (!s || !s.url) return;
    var win = window.open(s.url, "_blank");
    if (win) { try { win.opener = null; } catch (e) { /* ignore */ } }
  });

  /* ---------- Fullscreen ---------- */
  function enterFs() {
    bk.classList.add("fs");
    exitFsBtn.hidden = false;
    var req = bk.requestFullscreen || bk.webkitRequestFullscreen;
    if (req) { try { var p = req.call(bk); if (p && p.catch) p.catch(function () { /* CSS mode still holds */ }); } catch (e) { /* ignore */ } }
  }
  function exitFs() {
    bk.classList.remove("fs");
    exitFsBtn.hidden = true;
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (fsEl) { var ex = document.exitFullscreen || document.webkitExitFullscreen; if (ex) { try { ex.call(document); } catch (e) { /* ignore */ } } }
  }
  fsBtn.addEventListener("click", enterFs);
  exitFsBtn.addEventListener("click", exitFs);
  document.addEventListener("fullscreenchange", function () {
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (!fsEl && bk.classList.contains("fs")) {
      bk.classList.remove("fs");
      exitFsBtn.hidden = true;
    }
  });
  document.addEventListener("webkitfullscreenchange", function () {
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    if (!fsEl && bk.classList.contains("fs")) {
      bk.classList.remove("fs");
      exitFsBtn.hidden = true;
    }
  });

  /* ---------- Tabs events ---------- */
  tabsEl.addEventListener("click", function (e) {
    var x = e.target.closest("[data-bk-close]");
    if (x) { closeTab(parseInt(x.dataset.bkClose, 10)); return; }
    var t = e.target.closest("[data-bk-tab]");
    if (t) setActive(parseInt(t.dataset.bkTab, 10));
  });
  tabsEl.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var t = e.target.closest("[data-bk-tab]");
    if (t) { e.preventDefault(); setActive(parseInt(t.dataset.bkTab, 10)); }
  });
  $("bkNewtab").addEventListener("click", newTab);

  /* ---------- Quick links ---------- */
  var NT_LINKS = [
    { label: "Games", cls: "chalkle", view: "games" },
    { label: "Music", cls: "chalkle", view: "music" },
    { label: "Movies", cls: "chalkle", view: "movies" },
    { label: "Chat", cls: "chalkle", view: "chat" },
    { label: "Sites", cls: "chalkle", view: "sites" },
    { label: "Apps", cls: "chalkle", view: "apps-tools" }
  ];
  var WEB_LINKS = [
    { label: "Google", url: "https://www.google.com" },
    { label: "YouTube", url: "https://www.youtube.com" },
    { label: "Wikipedia", url: "https://www.wikipedia.org" },
    { label: "Spotify", url: "https://open.spotify.com" },
    { label: "Poki", url: "https://www.poki.com" },
    { label: "GeoGuessr", url: "https://www.geoguessr.com" }
  ];
  function renderNtLinks() {
    var html = "";
    NT_LINKS.forEach(function (l) {
      html += '<button class="bk-nt-link" type="button" data-bk-goto="' + l.view + '">' + escapeHtml(l.label) + "</button>";
    });
    WEB_LINKS.forEach(function (l) {
      html += '<button class="bk-nt-link" type="button" data-bk-url="' + escapeHtml(l.url) + '">' + escapeHtml(l.label) + "</button>";
    });
    $("bkNtLinks").innerHTML = html;
  }
  $("bkNtLinks").addEventListener("click", function (e) {
    var g = e.target.closest("[data-bk-goto]");
    if (g) { backToChalkleWithView(g.dataset.bkGoto); return; }
    var u = e.target.closest("[data-bk-url]");
    if (u) navigate(u.dataset.bkUrl);
  });
  function backToChalkleWithView(view) {
    if (embedded) {
      try { window.parent.postMessage({ chalkle: "goto", view: view }, "*"); } catch (e) { /* ignore */ }
      return;
    }
    try {
      if (window.opener && window.opener.postMessage) window.opener.postMessage({ chalkle: "goto", view: view }, "*");
    } catch (e) { /* ignore */ }
    location.href = "/";
  }

  /* ---------- Resume ---------- */
  try {
    var last = localStorage.getItem("chalkle-browser-last");
    if (last) {
      resumeBtn.classList.add("show");
      resumeLabel.textContent = "Resume " + cleanUrl(last);
      resumeBtn.addEventListener("click", function () { navigate(last); });
    }
  } catch (e) { /* no storage */ }

  /* ---------- Keyboard ---------- */
  document.addEventListener("keydown", function (e) {
    if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); back(); }
    else if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); forward(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key === "r" || e.key === "R")) { e.preventDefault(); reload(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key === "l" || e.key === "L")) { e.preventDefault(); focusAddr(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key === "t" || e.key === "T")) { e.preventDefault(); newTab(); }
    else if ((e.ctrlKey || e.metaKey) && (e.key === "w" || e.key === "W")) {
      e.preventDefault();
      var s = active();
      if (s) closeTab(s.id);
    }
    else if (e.key === "Escape") {
      if (bk.classList.contains("fs")) { exitFs(); return; }
      if (document.activeElement === addr) { addr.blur(); addrIco.classList.remove("is-editing"); }
      else if (document.activeElement === ntAddr) { ntAddr.blur(); }
    }
  });

  /* ---------- Init ---------- */
  renderNtLinks();
  newTab();
  try {
    var q = new URLSearchParams(location.search).get("url");
    if (q) navigate(resolveUrl(q));
  } catch (e) { /* ignore */ }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chalkle</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0f12}
</style>
</head>
<body>
<script>
(function(){
  var h = (location.hash || "").replace(/^#/, "");
  var u = "";
  try { u = atob(h); } catch (e) { /* bad payload */ }
  if (u && /^https?:\/\//i.test(u)) {
    try { window.location.replace(u); } catch (e) { window.location.href = u; }
  } else {
    document.write('<p style="color:#9aa0a6;font:14px system-ui;padding:24px">Nothing to load.</p>');
  }
})();
</script>
<noscript>JavaScript is required.</noscript>
</body>
</html>

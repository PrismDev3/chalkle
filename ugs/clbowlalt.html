<!DOCTYPE html>
<html lang="en">
<head>
<base href="https://cdn.jsdelivr.net/gh/SenpaiX1/ghdfhres@latest/">
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
<meta charset="utf-8" />
<meta http-equiv="pragma" content="no-cache" />
<title>Retro Bowl</title>
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%}
  canvas{image-rendering:pixelated;touch-action:none;margin:0;padding:0;border:0}
</style>
</head>
<body>
<img src="html5game/splash.png" id="GM4HTML5_loadingscreen" alt="" style="display:none" />
<canvas id="canvas" width="853" height="480" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)"></canvas>
<script type="text/javascript" src="https://rawcdn.githack.com/bubbls/UGS-Assets/1523e1e73e0b1c006b7e17639135d68b79f6e4d8/retro%20bowl/html5game/RetroBowl.js"></script>
<script src="poki-sdk.js"></script>
<script>
window.PokiSDK_OK = false; window.PokiSDK_loadState = 0;
function PokiSDK_fin(ok){ window.PokiSDK_OK = ok; window.PokiSDK_loadState = 2; }
(function(){
  try{
    if(window.PokiSDK){ PokiSDK.init().then(function(){ PokiSDK_fin(true); }).catch(function(){ PokiSDK_fin(false); }); }
    else { PokiSDK_fin(false); }
  }catch(e){ PokiSDK_fin(false); }
})();
window.onload = function(){
  var t0 = Date.now();
  (function wait(){
    if(window.PokiSDK_loadState === 2 || Date.now() - t0 > 3000){ GameMaker_Init(); }
    else { setTimeout(wait, 50); }
  })();
};
</script>
</body>
</html>

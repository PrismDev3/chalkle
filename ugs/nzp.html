<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NZ: Portable</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #050505; color: #e8ddd2; overflow: hidden; }
  #nzp-load {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 600 14px/1.5 "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  #nzp-load .nzp-box { text-align: center; max-width: 80vw; }
  #nzp-load h1 { margin: 0 0 10px; font-size: clamp(22px, 4vw, 34px); letter-spacing: .5px; color: #ff542a; }
  #nzp-load p { margin: 0 0 14px; color: #9b8f85; }
  .nzp-bar { width: min(340px, 64vw); height: 12px; margin: 0 auto; border-radius: 999px; background: #1c1210; overflow: hidden; }
  .nzp-bar > i { display: block; height: 100%; width: 0; border-radius: 999px; background: #ff542a; transition: width .15s ease; }
  #nzp-msg { margin-top: 12px; font-size: 12px; color: #9b8f85; min-height: 18px; }
  .nzp-dots span { animation: nzpdot 1.2s infinite; display: inline-block; }
  .nzp-dots span:nth-child(2) { animation-delay: .2s; }
  .nzp-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes nzpdot { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
</style>
</head>
<body>
<div id="nzp-load">
  <div class="nzp-box">
    <h1>NZ: Portable</h1>
    <p>Loading game<span class="nzp-dots"><span>.</span><span>.</span><span>.</span></span></p>
    <div class="nzp-bar"><i id="nzp-bar"></i></div>
    <div id="nzp-msg"></div>
  </div>
</div>
<script>
/* NZ: Portable is a 134 MB single-file HTML build - over GitHub's 100 MB
   per-file hard limit - so it ships as byte-exact chunks under ugs/nzp/
   (part-00..part-08). This loader fetches them in order and streams them
   into the document via document.write, which keeps the real relay origin
   (the game's own scripts must run same-origin). On mirrors the /ugs/
   launch URL is re-pointed at the relay, so the chunks resolve correctly
   there too.

   Two things keep the launch quick and honest:
   1. The Chalkle service worker (sw.js) keeps every part in its own cache
      bucket, so the first launch downloads 134 MB and every later launch
      reads the parts off the disk. The fetch below asks for the cached copy
      first, which the worker answers when it has one.
   2. A part that fails gets two more tries before the loader gives up, and
      the message names the chunk that failed instead of a bare "error". */
(function () {
  "use strict";
  var PARTS = 9;
  var TRIES = 3;
  var bar = document.getElementById("nzp-bar");
  var msg = document.getElementById("nzp-msg");
  var count = 0;

  function status(t) { if (msg) msg.textContent = t || ""; }

  var opened = false;

  function partName(i) { return "nzp/part-" + (i < 10 ? "0" : "") + i; }

  function fetchPart(url, name, attempt) {
    return fetch(url, { cache: "force-cache", credentials: "omit" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status + " on " + name);
        return r.text();
      })
      .catch(function (e) {
        if (attempt + 1 >= TRIES) throw e;
        status("Retrying " + name + " (" + (attempt + 2) + " of " + TRIES + ")");
        return new Promise(function (done) { setTimeout(done, 700 * (attempt + 1)); })
          .then(function () { return fetchPart(url, name, attempt + 1); });
      });
  }

  function load(i) {
    if (i >= PARTS) {
      if (opened) {
        try { document.close(); } catch (e) {}
      }
      return;
    }
    var name = partName(i);
    var url;
    try { url = new URL(name, location.href).href; } catch (e) { url = name; }
    fetchPart(url, name, 0)
      .then(function (text) {
        if (!text || text.length < 100) throw new Error("Empty part " + name);
        if (!opened) {
          opened = true;
          try { document.open(); } catch (e) {}
        }
        document.write(text);
        count++;
        if (bar) bar.style.width = Math.round((count / PARTS) * 100) + "%";
        status("Loading chunk " + count + " of " + PARTS + " (" + Math.round((count / PARTS) * 100) + "%)");
        load(i + 1);
      })
      .catch(function (e) {
        status("Couldn't load " + name + " (" + e.message + "). Check your connection and refresh.");
      });
  }

  status("Preparing...");
  load(0);
})();
</script>
</body>
</html>

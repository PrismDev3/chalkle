<script>
/* Mirror shim. On static mirrors (jsDelivr / GitHub Pages / Cloudflare Pages)
   root-absolute server routes resolve against the mirror host and die, so they
   are re-pointed at the production relay instead. No-op on the real site. */
(function () {
    var RELAY = 'https://chalkle.lootline.xyz';
    var ROUTES = ['/api/', '/res/', '/_active', '/_sync', '/_fetch'];
    function mirrorCtx() {
        try {
            var h = (location.hostname || '').toLowerCase();
            if (h === 'lootline.xyz' || h === 'www.lootline.xyz' || h === 'chalkle.lootline.xyz') return false;
            if (h && /^(?:cdn\.jsdelivr\.net|.*\.githack\.(?:com|co)|unpkg\.com|.*\.github\.io|.*\.pages\.dev|.*\.netlify\.app|.*\.vercel\.app|.*\.gitlab\.io|raw\.githubusercontent\.com)$/.test(h)) return true;
            if (location.protocol !== 'http:' && location.protocol !== 'https:') return true;
            if (!h && window.parent && window.parent !== window) {
                var ph = '';
                try { ph = (window.parent.location.hostname || '').toLowerCase(); } catch (e) { ph = ''; }
                if (ph === 'lootline.xyz' || ph === 'www.lootline.xyz' || ph === 'chalkle.lootline.xyz') return false;
                return true;
            }
        } catch (e) { return true; }
        return false;
    }
    window.__CM_MIRROR__ = mirrorCtx();
    window.__CM_RELAY__ = window.__CM_MIRROR__ ? RELAY : '';
    /* Legacy aliases kept so older tooling (scripts/tmp-mirror-tests.cjs) can
       still assert the shim contract. */
    window.__MB_RELAY__ = window.__CM_MIRROR__ ? RELAY : null;
    window.cmRelayBase = function () { return window.__CM_RELAY__ ? RELAY : ''; };
    window.__mbRelayBase = window.cmRelayBase;
    function toRelay(url) {
        if (!url || typeof url !== 'string') return url;
        if (url.indexOf('data:') === 0 || url.indexOf('blob:') === 0) return url;
        var path = null;
        if (url.charAt(0) === '/') path = url;
        else {
            var m = url.match(/^https?:\/\/[^\/]+(\/[^?#]*)([?#].*)?$/i);
            if (m && m[1]) path = m[1] + (m[2] || '');
        }
        if (!path) return url;
        for (var i = 0; i < ROUTES.length; i++) {
            if (path.indexOf(ROUTES[i]) === 0) return RELAY + path;
        }
        return url;
    }
    /* Only a mirror rewrites routes: on the real site (or any same-origin
       deploy) /api/ and /res/ are served by this very server, so touching
       them would send local traffic to production. */
    window.cmRelayUrl = function (url) {
        if (!window.__CM_MIRROR__) return url;
        return toRelay(url);
    };
    if (!window.__CM_MIRROR__) return;
    var _fetch = window.fetch;
    if (_fetch) {
        window.fetch = function (input, init) {
            try {
                if (typeof input === 'string') input = toRelay(input);
                else if (input && input.url) input = new Request(toRelay(input.url), input);
            } catch (e) { /* fall through */ }
            return _fetch.call(window, input, init);
        };
    }
})();

<style>
/* ==========================================================================
   CHLAKLE MOVIES
   One dark surface, one accent (Chalkle green), soft film grain, restrained
   motion. Everything is same-origin: posters, metadata, and the embeds
   themselves are routed through the site's own relay.
   ========================================================================== */
@font-face {
  font-family: "Boogaloo";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("assets/fonts/boogaloo-latin.woff2") format("woff2");
}
@font-face {
  font-family: "Space Grotesk";
  font-style: normal;
  font-weight: 500 700;
  font-display: swap;
  src: url("assets/fonts/space-grotesk-latin.woff2") format("woff2");
}
* { margin: 0; padding: 0; box-sizing: border-box; }
[hidden] { display: none !important; }
:root {
  --bg: #0d0c0a;
  --bg-2: #131210;
  --surface: #161513;
  --surface-2: #1d1b18;
  --line: rgba(255, 255, 255, 0.08);
  --line-2: rgba(255, 255, 255, 0.14);
  --text: #f2f0ec;
  --muted: #9b968d;
  --dim: #6f6a63;
  --accent: #4cc56f;
  --accent-ink: #06240f;
  --accent-soft: rgba(76, 197, 111, 0.14);
  --gold: #f2c14e;
  --danger: #ff5d5d;
  --r-sm: 8px;
  --r: 12px;
  --r-lg: 18px;
  --r-xl: 26px;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  --head-h: 62px;
  --display: "Boogaloo", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  --ui: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(1100px 520px at 12% -12%, rgba(76, 197, 111, 0.10), transparent 62%),
    radial-gradient(820px 460px at 96% 4%, rgba(120, 150, 255, 0.08), transparent 60%),
    radial-gradient(900px 700px at 50% 118%, rgba(255, 120, 90, 0.05), transparent 65%);
}
::selection { background: var(--accent); color: var(--accent-ink); }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.cm-scroll::-webkit-scrollbar { height: 8px; width: 8px; }
.cm-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); border-radius: 99px; }
.cm-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }
.cm-scroll::-webkit-scrollbar-track { background: transparent; }

/* ------------------------------------------------------------------ header */
.cm-app { position: relative; z-index: 1; min-height: 100%; }
.cm-head {
  position: sticky;
  top: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 10px;
  height: var(--head-h);
  padding: 0 clamp(12px, 3vw, 30px);
  background: linear-gradient(180deg, rgba(13, 12, 10, 0.94), rgba(13, 12, 10, 0.72));
  backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.cm-head.is-scrolled { border-bottom-color: var(--line); background: rgba(11, 10, 9, 0.96); }
.cm-brand { display: flex; align-items: center; gap: 9px; flex: none; }
.cm-mark {
  width: 30px; height: 30px;
  flex: none;
  border-radius: 9px;
  background: var(--accent);
  color: var(--accent-ink);
  display: grid; place-items: center;
  font-family: var(--display);
  font-size: 19px;
  box-shadow: 0 6px 18px rgba(76, 197, 111, 0.28);
}
.cm-word {
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 0.4px;
  line-height: 1;
  display: flex; align-items: baseline; gap: 6px;
  white-space: nowrap;
}
.cm-word small {
  font-family: var(--ui);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2.2px;
  text-transform: uppercase;
  color: var(--dim);
}
.cm-tabs { display: flex; align-items: center; gap: 2px; margin-left: 6px; overflow-x: auto; scrollbar-width: none; }
.cm-tabs::-webkit-scrollbar { display: none; }
.cm-tab {
  padding: 7px 12px;
  border-radius: 99px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  transition: color 0.16s ease, background 0.16s ease;
}
.cm-tab:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }
.cm-tab.is-on { color: var(--accent-ink); background: var(--accent); font-weight: 700; }
.cm-spacer { flex: 1 1 auto; }
.cm-search {
  position: relative;
  display: flex; align-items: center; gap: 8px;
  width: clamp(180px, 26vw, 340px);
  height: 38px;
  padding: 0 10px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.04);
  transition: border-color 0.16s ease, background 0.16s ease;
}
.cm-search:focus-within { border-color: var(--accent); background: rgba(255, 255, 255, 0.07); }
.cm-search svg { width: 15px; height: 15px; flex: none; color: var(--dim); }
.cm-search input {
  flex: 1; min-width: 0;
  border: 0; background: none; outline: none;
  font-size: 13px;
}
.cm-search input::placeholder { color: var(--dim); }
.cm-search kbd {
  flex: none;
  font-family: var(--ui); font-size: 10px; font-weight: 600;
  color: var(--dim);
  border: 1px solid var(--line-2);
  border-radius: 5px;
  padding: 1px 5px;
}
.cm-search-x { flex: none; color: var(--dim); font-size: 17px; line-height: 1; padding: 2px 4px; }
.cm-search-x:hover { color: var(--text); }
.cm-icon {
  flex: none;
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.04);
  color: var(--muted);
  transition: color 0.16s ease, border-color 0.16s ease, background 0.16s ease;
}
.cm-icon:hover, .cm-icon.is-on { color: var(--text); border-color: var(--line-2); background: rgba(255, 255, 255, 0.08); }
.cm-icon svg { width: 17px; height: 17px; }
.cm-icon.is-live { color: var(--accent); border-color: rgba(76, 197, 111, 0.45); }

/* suggestions */
.cm-suggest {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: min(420px, 88vw);
  max-height: 62vh;
  overflow-y: auto;
  padding: 6px;
  border-radius: var(--r);
  border: 1px solid var(--line-2);
  background: rgba(18, 17, 15, 0.98);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
}
.cm-sug {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  padding: 7px 8px;
  border-radius: var(--r-sm);
  text-align: left;
}
.cm-sug:hover, .cm-sug.is-active { background: rgba(255, 255, 255, 0.07); }
.cm-sug img { width: 34px; height: 50px; border-radius: 5px; object-fit: cover; background: var(--surface-2); flex: none; }
.cm-sug-t { font-size: 13px; font-weight: 600; }
.cm-sug-s { font-size: 11px; color: var(--dim); }

/* -------------------------------------------------------------------- main */
.cm-main { padding: clamp(14px, 3vw, 26px) clamp(12px, 3vw, 30px) 90px; max-width: 1700px; margin: 0 auto; }
.cm-view { animation: cm-in 0.25s ease both; }
@keyframes cm-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* hero */
.cm-hero {
  position: relative;
  min-height: clamp(320px, 52vh, 520px);
  border-radius: var(--r-xl);
  overflow: hidden;
  border: 1px solid var(--line);
  background: var(--surface);
  margin-bottom: 30px;
  isolation: isolate;
}
.cm-hero-bg { position: absolute; inset: 0; }
.cm-hero-bg img { width: 100%; height: 100%; object-fit: cover; opacity: 0.55; transform: scale(1.03); }
.cm-hero-bg::after {
  content: "";
  position: absolute; inset: 0;
  background:
    linear-gradient(90deg, rgba(13, 12, 10, 0.96) 0%, rgba(13, 12, 10, 0.72) 42%, rgba(13, 12, 10, 0.15) 78%),
    linear-gradient(0deg, rgba(13, 12, 10, 0.98) 2%, transparent 55%);
}
.cm-hero-body {
  position: relative;
  z-index: 2;
  max-width: 640px;
  padding: clamp(22px, 4vw, 48px);
  display: flex; flex-direction: column; gap: 14px;
  min-height: inherit;
  justify-content: flex-end;
}
.cm-badge {
  align-self: flex-start;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: 99px;
  background: var(--accent-soft);
  border: 1px solid rgba(76, 197, 111, 0.35);
  color: var(--accent);
  font-size: 10px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
}
.cm-hero-title {
  font-family: var(--display);
  font-size: clamp(30px, 5.2vw, 58px);
  line-height: 0.98;
  letter-spacing: 0.2px;
  text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
}
.cm-hero-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.cm-hero-meta .dot { width: 3px; height: 3px; border-radius: 99px; background: var(--dim); }
.cm-chip {
  padding: 2px 8px;
  border: 1px solid var(--line-2);
  border-radius: 99px;
  font-size: 11px;
  color: var(--muted);
}
.cm-hero-ov {
  color: #cfcbc4;
  font-size: 13.5px;
  max-width: 56ch;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.cm-hero-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 4px; }
.cm-btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 42px;
  padding: 0 18px;
  border-radius: 99px;
  border: 1px solid var(--line-2);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text);
  font-size: 13.5px; font-weight: 600;
  transition: transform 0.14s ease, background 0.16s ease, border-color 0.16s ease;
}
.cm-btn:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-1px); }
.cm-btn svg { width: 16px; height: 16px; }
.cm-btn.is-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cm-btn.is-primary:hover { background: #5dd57f; }
.cm-btn.is-ghost { background: transparent; }
.cm-btn.is-sm { height: 34px; padding: 0 13px; font-size: 12.5px; }

/* rows */
.cm-row { margin-bottom: 30px; position: relative; }
.cm-row:last-child { margin-bottom: 10px; }
.cm-row-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.cm-row-title { font-size: 16px; font-weight: 700; letter-spacing: 0.2px; }
.cm-row-sub { font-size: 11.5px; color: var(--dim); }
.cm-row-nav { margin-left: auto; display: flex; gap: 6px; }
.cm-arrow {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.04);
  color: var(--muted);
}
.cm-arrow:hover { color: var(--text); border-color: var(--line-2); background: rgba(255, 255, 255, 0.09); }
.cm-arrow svg { width: 15px; height: 15px; }
.cm-rail {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scroll-behavior: smooth;
  padding: 4px 2px 12px;
  scrollbar-width: thin;
}
.cm-rail > * { flex: none; }

/* cards */
.cm-card {
  width: 158px;
  text-align: left;
  position: relative;
  border-radius: var(--r);
  transition: transform 0.18s ease;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.cm-card:hover { transform: translateY(-4px); }
.cm-card:focus-visible { outline: none; }
.cm-card:focus-visible .cm-card-art { outline: 2px solid var(--accent); outline-offset: 3px; }
.cm-card-art {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 2 / 3;
  border-radius: var(--r);
  overflow: hidden;
  background: linear-gradient(163deg, #262219, #16140f 58%, #11100c);
  border: 1px solid var(--line);
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
}
.cm-card-art img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: transform 0.35s ease, opacity 0.3s ease; }
.cm-card-art img.cm-in { opacity: 1; }
.cm-card-art.is-missing img { display: none; }
.cm-card:hover .cm-card-art img { transform: scale(1.06); }
.cm-card-art.is-missing::after {
  content: attr(data-t);
  position: absolute; inset: 0;
  display: grid; place-items: center;
  padding: 12px; text-align: center;
  font-size: 12px; font-weight: 600; letter-spacing: 0.2px;
  color: rgba(242, 240, 236, 0.82);
  background: linear-gradient(163deg, #262219, #16140f 58%, #11100c);
  -webkit-line-clamp: 5;
  -webkit-box-orient: vertical;
  display: -webkit-box;
  overflow: hidden;
  word-break: break-word;
  -webkit-user-select: none; user-select: none;
}
/* landscape variant: continue-watching tiles */
.cm-card.is-wide { width: 252px; }
.cm-card.is-wide .cm-card-art { aspect-ratio: 16 / 9; }
.cm-card.is-wide .cm-card-t { margin-top: 8px; }
.cm-wide-bar {
  position: absolute; left: 8px; right: 8px; bottom: 8px;
  height: 4px; border-radius: 99px;
  background: rgba(255, 255, 255, 0.22);
  overflow: hidden;
}
.cm-wide-bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.cm-card-rate {
  position: absolute; top: 7px; left: 7px;
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 6px;
  border-radius: 99px;
  background: rgba(8, 8, 7, 0.78);
  backdrop-filter: blur(6px);
  color: var(--gold);
  font-size: 11px; font-weight: 700;
}
.cm-card-rate svg { width: 10px; height: 10px; }
.cm-card-kind {
  position: absolute; top: 7px; right: 7px;
  padding: 2px 6px;
  border-radius: 99px;
  background: rgba(8, 8, 7, 0.78);
  backdrop-filter: blur(6px);
  color: #d8d4cc;
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
}
.cm-card-save {
  position: absolute; bottom: 7px; right: 7px;
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border-radius: 99px;
  background: rgba(8, 8, 7, 0.76);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #d8d4cc;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.16s ease, transform 0.16s ease, color 0.16s ease;
}
.cm-card:hover .cm-card-save { opacity: 1; transform: none; }
.cm-card-save:hover { color: var(--accent); border-color: rgba(76, 197, 111, 0.5); }
.cm-card-save.is-on { opacity: 1; transform: none; color: var(--accent); border-color: rgba(76, 197, 111, 0.5); }
.cm-card-save svg { width: 14px; height: 14px; }
.cm-card-bar {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 4px;
  background: rgba(255, 255, 255, 0.16);
}
.cm-card-bar i { display: block; height: 100%; background: var(--accent); }
.cm-card-t {
  display: block;
  margin-top: 8px;
  font-size: 12.5px; font-weight: 600; line-height: 1.32;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cm-card-s {
  display: block;
  font-size: 11px; color: var(--dim); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cm-card-s b { color: var(--muted); font-weight: 600; }

/* continue-watching row head accent */
.cm-row[data-col="resume"] .cm-row-title::before {
  content: "";
  display: inline-block;
  width: 8px; height: 8px;
  margin-right: 8px;
  border-radius: 99px;
  background: var(--accent);
  box-shadow: 0 0 10px rgba(76, 197, 111, 0.65);
}
.cm-row[data-col="resume"] .cm-arrow {
  width: 28px; height: 28px;
}
.cm-row[data-col="resume"] .cm-rail { padding-bottom: 10px; }

/* grids + filters */
.cm-filter {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  margin-bottom: 20px;
}
.cm-filter .cm-select {
  height: 34px;
  padding: 0 10px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
  font-size: 12.5px;
}
.cm-select option { background: #14120f; color: var(--text); }
.cm-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.cm-chips::-webkit-scrollbar { display: none; }
.cm-pill {
  flex: none;
  padding: 6px 12px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
  color: var(--muted);
  font-size: 12.5px;
  white-space: nowrap;
}
.cm-pill:hover { color: var(--text); border-color: var(--line-2); }
.cm-pill.is-on { background: var(--accent-soft); border-color: rgba(76, 197, 111, 0.5); color: var(--accent); font-weight: 600; }
.cm-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 18px 14px;
}
.cm-grid .cm-card { width: auto; }
.cm-empty {
  padding: 60px 20px;
  text-align: center;
  color: var(--muted);
}
.cm-empty b { display: block; font-size: 17px; color: var(--text); margin-bottom: 6px; font-family: var(--display); letter-spacing: 0.3px; }
.cm-load { display: grid; place-items: center; padding: 26px 0 40px; color: var(--dim); font-size: 12.5px; }
.cm-sk { border-radius: var(--r); background: linear-gradient(100deg, #191713 30%, #232019 50%, #191713 70%); background-size: 240% 100%; animation: cm-sk 1.25s linear infinite; }

/* ------------------------------------------------------------- detail sheet */
.cm-sheet {
  position: fixed; inset: 0; z-index: 90;
  display: flex; align-items: flex-start; justify-content: center;
  padding: clamp(0px, 3vh, 40px) clamp(0px, 3vw, 34px);
  background: rgba(6, 6, 5, 0.72);

  animation: cm-fade 0.2s ease both;
  overflow: hidden;
}
@keyframes cm-fade { from { opacity: 0; } to { opacity: 1; } }
.cm-sheet-card {
  position: relative;
  width: min(1060px, 100%);
  max-height: 100%;
  overflow-y: auto;
  border-radius: var(--r-xl);
  border: 1px solid var(--line-2);
  background: var(--bg-2);
  box-shadow: var(--shadow);
  animation: cm-pop 0.24s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes cm-pop { from { opacity: 0; transform: translateY(16px) scale(0.985); } to { opacity: 1; transform: none; } }
.cm-d-hero { position: relative; min-height: 260px; }
.cm-d-hero img.bd { width: 100%; height: 100%; min-height: 260px; object-fit: cover; position: absolute; inset: 0; opacity: 0.42; }
.cm-d-hero::after {

}
.cm-d-close {
  position: absolute; top: 12px; right: 12px; z-index: 4;
  width: 34px; height: 34px;

  border-radius: 99px;
  background: rgba(10, 10, 9, 0.7);
  border: 1px solid var(--line-2);
  color: var(--text);
  font-size: 18px; line-height: 1;
}
.cm-d-close:hover { background: rgba(10, 10, 9, 0.95); }
.cm-d-top {
  position: relative; z-index: 3;
  display: flex; gap: clamp(14px, 3vw, 26px);
  padding: clamp(16px, 3vw, 30px);
  align-items: flex-end;
}
.cm-d-poster {
  flex: none;
  width: clamp(110px, 17vw, 168px);
  aspect-ratio: 2 / 3;
  border-radius: var(--r);
  overflow: hidden;
  border: 1px solid var(--line-2);
  background: var(--surface-2);
  box-shadow: var(--shadow);
}
.cm-d-poster img { width: 100%; height: 100%; object-fit: cover; }
.cm-d-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 9px; }
.cm-d-title { font-family: var(--display); font-size: clamp(24px, 3.6vw, 40px); line-height: 1; }
.cm-d-tag { font-size: 12.5px; color: var(--muted); font-style: italic; }
.cm-d-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.cm-d-body { padding: 0 clamp(16px, 3vw, 30px) clamp(20px, 3vw, 30px); }
.cm-d-sec { margin-top: 24px; }
.cm-d-sec > h3 {
  font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
  color: var(--dim); margin-bottom: 10px;
}
.cm-d-ov { color: #cfcbc4; font-size: 13.5px; max-width: 78ch; }
.cm-facts { display: flex; flex-wrap: wrap; gap: 22px; margin-top: 6px; }
.cm-fact { display: flex; flex-direction: column; gap: 2px; }
.cm-fact b { font-size: 12.5px; font-weight: 600; }
.cm-fact span { font-size: 10.5px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
.cm-cast { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.cm-cast-c { flex: none; width: 92px; text-align: center; }
.cm-cast-c .av {
  width: 92px; height: 92px; border-radius: 99px; overflow: hidden;
  background: var(--surface-2); border: 1px solid var(--line); margin-bottom: 7px;
  display: grid; place-items: center; color: var(--dim); font-size: 22px;
}
.cm-cast-c .av img { width: 100%; height: 100%; object-fit: cover; }
.cm-cast-c b { display: block; font-size: 11.5px; font-weight: 600; line-height: 1.3; }
.cm-cast-c span { font-size: 10.5px; color: var(--dim); }
.cm-seasons { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.cm-eps { display: flex; flex-direction: column; gap: 6px; max-height: 380px; overflow-y: auto; padding-right: 4px; }
.cm-ep {
  display: flex; align-items: center; gap: 12px;
  padding: 8px;
  border-radius: var(--r);
  border: 1px solid transparent;
  text-align: left;
  width: 100%;
}
.cm-ep:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--line); }
.cm-ep.is-on { background: var(--accent-soft); border-color: rgba(76, 197, 111, 0.4); }
.cm-ep-thumb {
  flex: none; width: 118px; aspect-ratio: 16 / 9;
  border-radius: var(--r-sm); overflow: hidden; background: var(--surface-2);
}
.cm-ep-thumb img { width: 100%; height: 100%; object-fit: cover; }
.cm-ep-txt { min-width: 0; flex: 1; }
.cm-ep-txt b { display: block; font-size: 12.5px; font-weight: 600; }
.cm-ep-txt span { font-size: 11.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cm-ep-n { flex: none; font-size: 11px; color: var(--dim); width: 74px; }

/* ---------------------------------------------------------------- player */
.cm-player {
  position: fixed; inset: 0; z-index: 120;
  display: flex; flex-direction: column;
  background: #060605;
  animation: cm-fade 0.18s ease both;
}
.cm-pl-top {
  display: flex; align-items: center; gap: 9px;
  padding: 8px clamp(10px, 2vw, 20px);

}
.cm-pl-title { min-width: 0; display: flex; flex-direction: column; gap: 1px; }

.cm-pl-title span { font-size: 10.5px; color: var(--dim); letter-spacing: 0.4px; }
.cm-pl-body { position: relative; flex: 1; min-height: 0; background: #000; }
.cm-pl-body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
.cm-pl-load {
  position: absolute; inset: 0; z-index: 2;
  display: grid; place-items: center; gap: 12px;
  background: radial-gradient(circle at 50% 45%, #17150f, #080807 70%);

}
.cm-pl-load.is-gone { display: none; }
.cm-spin {
  width: 34px; height: 34px; border-radius: 99px;
  border: 2px solid rgba(255, 255, 255, 0.14);
  border-top-color: var(--accent);
  animation: cm-spin 0.85s linear infinite;
}
@keyframes cm-spin { to { transform: rotate(360deg); } }
.cm-pl-load b { display: block; font-size: 14px; color: var(--text); font-family: var(--display); letter-spacing: 0.4px; }
.cm-pl-load small { display: block; font-size: 11.5px; color: var(--dim); margin-top: 4px; }
/* Once every source and mirror is exhausted the overlay is a RESULT, not a
   wait. Leaving the spinner turning over an error message reads as "still
   loading", so it stops and the actions take its place. */
.cm-pl-load.is-failed .cm-spin { display: none; }
.cm-pl-load.is-failed b { color: var(--accent); }
.cm-pl-load.is-failed small { max-width: 620px; }
.cm-pl-act { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
.cm-pl-act[hidden] { display: none; }
.cm-pl-act a.cm-btn { text-decoration: none; }
.cm-pl-bottom {
  display: flex; align-items: center; gap: 10px;
  padding: 8px clamp(10px, 2vw, 20px) 10px;
  background: rgba(10, 10, 9, 0.96);
  border-top: 1px solid var(--line);
  overflow-x: auto;
}
.cm-pl-note { font-size: 11px; color: var(--dim); white-space: nowrap; }
.cm-pl-note b { color: var(--accent); font-weight: 600; }
.cm-pl-eps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.cm-pl-ep {
  flex: none; max-width: 190px;
  padding: 5px 10px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
  font-size: 11.5px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cm-pl-ep.is-on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* drop menu */
.cm-drop { position: relative; }
.cm-menu {
  position: absolute; top: calc(100% + 6px); left: 0;
  min-width: 232px; max-height: 340px; overflow-y: auto;
  padding: 5px;
  border-radius: var(--r);
  border: 1px solid var(--line-2);
  background: rgba(18, 17, 15, 0.98);
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px);
  z-index: 30;
}
.cm-menu.right { left: auto; right: 0; }
.cm-mi {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 7px 9px;
  border-radius: var(--r-sm);
  font-size: 12.5px; text-align: left; color: var(--muted);
}
.cm-mi:hover { background: rgba(255, 255, 255, 0.07); color: var(--text); }
.cm-mi.is-on { color: var(--accent); }
.cm-mi .tick { margin-left: auto; font-size: 11px; }
.cm-mi-lbl { padding: 7px 9px 4px; font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--dim); }

/* settings + toasts */
.cm-panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 110;
  width: min(420px, 94vw);
  overflow-y: auto;
  padding: 18px 18px 60px;

  border-left: 1px solid var(--line-2);

}
@keyframes cm-slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.cm-panel h2 { font-family: var(--display); font-size: 22px; margin-bottom: 4px; }
.cm-panel .sub { font-size: 12px; color: var(--dim); margin-bottom: 18px; }
.cm-set {
  padding: 13px 0;

}
.cm-set:first-of-type { border-top: 0; }
.cm-set-top { display: flex; align-items: center; gap: 10px; }
.cm-set-top b { font-size: 13px; font-weight: 600; }
.cm-set small { font-size: 11.5px; color: var(--dim); line-height: 1.45; }
.cm-set select, .cm-set input[type="text"], .cm-set input[type="password"] {
  height: 36px; padding: 0 10px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line-2);
  background: rgba(255, 255, 255, 0.04);
  font-size: 12.5px;
  outline: none;
}
.cm-set select option { background: #14120f; }
.cm-sw {
  position: relative; margin-left: auto; flex: none;
  width: 42px; height: 23px; border-radius: 99px;
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid var(--line-2);
  transition: background 0.18s ease;
}
.cm-sw::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 17px; height: 17px; border-radius: 99px;
  background: #cfcbc4;
  transition: transform 0.18s cubic-bezier(0.3, 1.4, 0.5, 1), background 0.18s ease;
}
.cm-sw.is-on { background: var(--accent); border-color: var(--accent); }
.cm-sw.is-on::after { transform: translateX(19px); background: #07240f; }
.cm-toasts {
  position: fixed; left: 50%; bottom: 22px; z-index: 200;
  transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none;
}
.cm-toast {
  max-width: min(560px, 92vw);
  padding: 10px 15px;
  border-radius: 99px;
  border: 1px solid var(--line-2);
  background: rgba(20, 19, 16, 0.97);
  box-shadow: var(--shadow);
  font-size: 12.5px;
  animation: cm-toast 0.24s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.cm-toast.ok { border-color: rgba(76, 197, 111, 0.5); }
.cm-toast.warn { border-color: rgba(242, 193, 78, 0.5); }
.cm-toast.err { border-color: rgba(255, 93, 93, 0.5); }
@keyframes cm-toast { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* mobile */
@media (max-width: 900px) {
  .cm-word small { display: none; }
  .cm-tabs { order: 3; width: 100%; margin: 0; }
  .cm-head { height: auto; padding-bottom: 8px; flex-wrap: wrap; }
  .cm-search { flex: 1; width: auto; }
  .cm-d-top { flex-direction: column; align-items: flex-start; }
  .cm-d-poster { width: 120px; }
  .cm-pl-title b { max-width: 46vw; }
}
@media (max-width: 620px) {
  .cm-card { width: 130px; }
  .cm-card.is-wide { width: 224px; }
  .cm-grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 14px 10px; }
  .cm-ep-thumb { width: 84px; }
  .cm-ep-n { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .cm-card:hover .cm-wide-bar i { box-shadow: 0 0 8px rgba(76, 197, 111, 0.8); }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  .cm-rail { scroll-behavior: auto; }
}
body.cm-nolock { overflow: hidden; }
</style>

/* ==========================================================================
   CHLAKLE MOVIES - application
   Metadata: TMDB through the site's same-origin /api/tmdb route (works from
   mirrors too, via the relay base the head shim sets up).
   Playback: every embed URL is handed to the relay's /res/<hex> rewriting
   proxy BY DEFAULT, so provider domains are never contacted by the browser -
   neither network blocks nor X-Frame-Options can stop the player.
   ========================================================================== */
(function () {
'use strict';

var RELAY = (typeof window.cmRelayBase === 'function') ? window.cmRelayBase() : '';
var API_ROOT = RELAY + '/api/tmdb/';
var REGION = 'US';

function relayPath(url) {
    if (typeof window.cmRelayUrl === 'function') return window.cmRelayUrl(url);
    return url;
}
function encodeTarget(url) {
    try {
        var s = encodeURIComponent(url);
        var out = '';
        for (var i = 0; i < s.length; i++) {
            var c = s.charCodeAt(i) ^ (0x2f + (i % 0x31));

/* The one function that decides how playback reaches the provider. */
function routeThroughRelay(url) {
    if (!url) return url;
    if (/^(data|blob|about):/i.test(url)) return url;
    if (/^\/res\//.test(url)) return url;
    var abs = /^https?:\/\//i.test(url) ? url : null;
    if (!abs) {
        if (url.charAt(0) === '/' && location.protocol.indexOf('http') === 0) abs = location.origin + url;

function makeGrid(gridId, loadId, pageFn) {
    var grid = el(gridId), load = el(loadId);
    var page = 1, pages = 1, loading = false, done = false;
    var io = null;
    function skeletons(n) {
        var out = '';
        for (var i = 0; i < n; i++) out += '<span class="cm-sk" style="aspect-ratio:2/3"></span>';
        return out;
    }
    function step() {
        if (loading || done) return;
        loading = true;
        load.innerHTML = skeletons(4);
        pageFn(page).then(function (res) {
            load.innerHTML = '';
            grid.insertAdjacentHTML('beforeend', gridHTML(res.items));
            pages = res.pages || 1;
            page++;
            if (page > pages || !res.items.length) {
                done = true;
                if (!grid.children.length) {
                    grid.insertAdjacentHTML('beforeend', '<div class="cm-empty" style="grid-column:1/-1"><b>Nothing here yet</b>Try another genre, year or a wider search.</div>');
                } else {
                    load.innerHTML = '<span>That\u2019s everything \u00b7 ' + (page - 1) + ' pages</span>';
                }
            }
            loading = false;
        }).catch(function () {
            load.innerHTML = '';
            done = true;
            if (!grid.children.length) {
                grid.insertAdjacentHTML('beforeend', '<div class="cm-empty" style="grid-column:1/-1"><b>Could not reach the catalogue</b>The relay may be down - tap the shield in the header for status.</div>');
            }
            loading = false;
        });
    }
    if (io) io.disconnect();
    io = new IntersectionObserver(function (entries) {
        if (entries.some(function (e) { return e.isIntersecting; })) step();
    }, { rootMargin: '700px 0px' });
    io.observe(load);
    return { load: step };
}

/* ------------------------------------------------------------- player */
var PLAY = {
    ctx: null,
    order: [],
    pIdx: 0,
    mIdx: 0,
    mode: 'proxy',
    token: 0,
    watch: 0,
    health: 0,
    tick: 0,
    startedAt: 0,
    triedDirect: false,
    episodes: [],
    loads: 0,        /* frame navigations for the current source */
    firstLoad: 0,
    healthy: false,
    fails: {},       /* provider name -> why it was skipped, for the last panel */
    lastReason: '',  /* shown while rotating, so the wait explains itself */
    relayFailed: false
};

/* ------------------------------------------------------- source health */
/* Every proxied source is same-origin with this page, so the player can read
   the frame it just embedded and see WHY a source failed instead of showing a
   black rectangle: a Cloudflare wall, a crashed app, "not found", a frame the
   site refuses to be embedded in, or a page that reloads itself forever. It
   also sees the <video> element appear, which is the only honest proof that a
   source is actually playing - a frame firing load is not. */
var HEALTH_EVERY = 1200;      /* how often to look at the embedded chain */
/* 11s, not 18s. The failures this catches - a bot wall, a crashed app, "not in
   its library" - all show themselves in the first second or two, and six
   sources at 18s each leaves a viewer watching a spinner for three minutes
   before the app will admit that nothing worked. */
var HEALTH_DEADLINE = 11000;
/* Deliberately cheap, because this runs every 1.2s while a player loads.
   Serialising nested documents (outerHTML across dozens of frames) is what
   pegs a main thread, so the scan does the cheap query first and only reads
   text from SMALL documents. Big documents are live players in any case: the
   error pages this looks for are a few hundred bytes. */
function frameScan() {
    var acc = { videos: 0, frames: 0, depth: 0, reason: '', escaped: false };
    var seen = 0;
    function small(doc) {
        try { return !!doc.body && doc.body.childElementCount < 40; } catch (e) { return false; }
    }
    function walk(fr, d) {
        if (!fr || d > 3 || seen > 6) return;
        var doc;
        try { doc = fr.contentDocument; } catch (e) { return; }   /* cross-origin: nothing to read */
        if (!doc || !doc.documentElement) return;
        seen++;
        acc.depth = Math.max(acc.depth, d);
        acc.videos += doc.querySelectorAll('video').length;
        if (!acc.reason) {
            try {
                var doc2 = doc;
                if (doc2.querySelector('.cf-turnstile, #challenge-form, iframe[src*="challenges.cloudflare.com"]')) {
                    acc.reason = 'a bot check blocks it';
                } else if (small(doc2)) {
                    var html = doc2.documentElement.innerHTML;
                    acc.frames = doc2.querySelectorAll('iframe').length;
                    if (/Proxy couldn't load that page/.test(html)) acc.reason = 'the relay could not reach it';
                    else if (/Application error|client-side exception/i.test(html)) acc.reason = 'its player crashed on load';
                    else if (/This embed URL is invalid|isn't available|not available|no sources|Movie not found|404 Not Found/i.test(html)) acc.reason = 'the title is not in its library';
                }
            } catch (e) { /* keep scanning the rest */ }
        }
        var kids = doc.querySelectorAll('iframe');
        for (var i = 0; i < kids.length && i < 3; i++) walk(kids[i], d + 1);
    }
    var root = el('cm-pl-body').querySelector('iframe');
    if (root) {
        /* Every frame we embed goes through the relay, so it is SAME-ORIGIN
           with this page. A root frame we can no longer read has therefore
           left the relay altogether: an ad takeover, a popunder landing page,
           or a provider bouncing the visitor somewhere else. That matters
           because the <video> on such a page is an ad - counting it would
           mark a hijacked frame as a healthy source. */
        try {
            var here = root.contentWindow.location.href || '';
            /* Foreign ORIGIN, not foreign path: a player that pushState()s to
               its own route is still served by the relay and still ours. */
            acc.escaped = !!here && here !== 'about:blank' && here.indexOf(location.origin) !== 0;
        } catch (e) {
            acc.escaped = true;   /* unreadable == foreign origin */
        }
        walk(root, 1);
    }
    return acc;
}
function stopHealth() {
    clearInterval(PLAY.health);
    PLAY.health = 0;
    clearTimeout(PLAY.watch);
    PLAY.watch = 0;
}
function markHealthy() {
    if (PLAY.healthy) return;
    PLAY.healthy = true;
    stopHealth();
    PLAY.loaded = true;
    el('cm-pl-load').classList.add('is-gone');
    PLAY.startedAt = Date.now();
    startProgress();
    if (PLAY.ctx && !PLAY.ctx.trailer) rememberPlayed(PLAY.ctx.item);

function startHealth() {
    var token = PLAY.token;
    var started = Date.now();
    PLAY.healthy = false;
    stopHealth();
    PLAY.health = setInterval(function () {
        if (token !== PLAY.token) { clearInterval(PLAY.health); return; }
        var scan = frameScan();
        if (scan.videos > 0 && !scan.escaped) { markHealthy(); return; }
        if (scan.reason) { failSource(scan.reason); return; }
        /* Grace period first: a frame reports about:blank for a moment after
           it is created, and a provider legitimately hops between its own
           pages (still through /res/) while it starts up. */
        if (scan.escaped && Date.now() - started > 3000) {
            failSource('it redirected away, usually to an ad');
            return;
        }
        /* Two navigations of the same document inside a few seconds is not a
           player loading, it is a page reloading itself - usually an ad-block
           wall or a challenge that will never settle. It never plays and it
           pins a CPU core while it retries. */
        if (PLAY.loads >= 4 && Date.now() - PLAY.firstLoad < 10000) {
            failSource('it reloads itself in a loop');
            return;
        }

    }, HEALTH_EVERY);
}

        el('cm-pl-load-s').textContent = 'Official trailer (YouTube)';
    } else {
        el('cm-pl-load-t').textContent = 'Connecting to ' + currentProvider().name + '\u2026';
        /* While rotating, the previous source's own words explain the wait
           better than another line about the relay. */
        el('cm-pl-load-s').textContent = PLAY.lastReason
            ? 'Previous source: ' + PLAY.lastReason
            : (PLAY.mode === 'proxy'
                ? 'Streaming through the Chlakle relay - the provider domain is never contacted directly'
                : 'Direct connection to the provider (a network block can stop this)');
    }
    var raw = currentRawUrl();
    var src = currentDisplayUrl();
    body.querySelectorAll('iframe').forEach(function (f) { f.remove(); });
    var frame = document.createElement('iframe');
    /* allow= already grants fullscreen; adding allowfullscreen as well makes
       Chrome log a precedence warning on every load. */
    frame.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write; gyroscope');
    frame.setAttribute('referrerpolicy', 'no-referrer');
    frame.setAttribute('title', PLAY.ctx.item.title + ' player');
    frame.addEventListener('load', function () { if (token === PLAY.token) onFrameLoad(); });
    PLAY.loads = 0;
    body.appendChild(frame);
    frame.src = src;
    el('cm-pl-tab').href = raw;
    el('cm-pl-note').innerHTML = PLAY.ctx.trailer ? 'Official trailer'
        : ('<b>' + esc(PLAY.mode === 'proxy' ? 'Relayed' : 'Direct') + '</b> \u00b7 ' + esc(currentProvider().name) +
            (PLAY.mode === 'proxy' ? ' \u00b7 provider domain hidden from this network' : ''));
    startHealth();
}
/* A load event only means a document arrived - often an error page or a bot
   wall. It is counted (the reload-loop check needs that) and otherwise left to
   the health scan, which waits for an actual <video>. */
function onFrameLoad() {
    PLAY.loads++;
    if (!PLAY.firstLoad) PLAY.firstLoad = Date.now();
    if (PLAY.ctx && PLAY.ctx.trailer) {
        /* Trailers are a plain YouTube iframe: there is nothing to inspect. */
        PLAY.loaded = true;
        el('cm-pl-load').classList.add('is-gone');
    }
}
function failSource(reason) {
    if (!PLAY.ctx || PLAY.ctx.trailer) return;
    var p = currentProvider();
    /* Remember the reason per provider: the final panel lists them, so a
       viewer learns which source to stop trying instead of guessing. */
    if (p && !PLAY.fails[p.name]) PLAY.fails[p.name] = reason;
    PLAY.lastReason = p ? p.name + ' - ' + reason : reason;
    /* Only a relay-side failure justifies contacting providers directly. If a
       provider's own page rejected the title, going direct just repeats the
       same rejection in a mode nothing can inspect. */
    if (/relay could not reach/i.test(reason)) PLAY.relayFailed = true;
    onFrameStall(reason);
}
function onFrameStall(reason) {
    if (!PLAY.ctx || PLAY.ctx.trailer) return;
    var p = currentProvider();
    if (PLAY.mIdx + 1 < p.bases.length) {
        PLAY.mIdx++;
        toast(p.name + ' - ' + (reason || 'no player') + ' - trying mirror ' + (PLAY.mIdx + 1) + '\u2026', 'warn');
        loadCurrent();
        return;
    }
    if (PLAY.pIdx + 1 < PLAY.order.length) {
        PLAY.pIdx++;
        PLAY.mIdx = 0;
        toast('Switched to ' + currentProvider().name, 'warn');
        updateProviderLabel();
        loadCurrent();
        return;
    }
    if (PLAY.mode === 'proxy' && !PLAY.triedDirect && PLAY.relayFailed) {
        PLAY.triedDirect = true;
        PLAY.mode = 'direct';
        PLAY.pIdx = 0;
        PLAY.mIdx = 0;
        toast('Relay could not reach any source - trying direct connections', 'warn');
        updateProviderLabel();
        loadCurrent();
        return;
    }
    var why = Object.keys(PLAY.fails).map(function (k) { return k + ' - ' + PLAY.fails[k]; });
    el('cm-pl-load').classList.add('is-failed');
    el('cm-pl-load-t').textContent = 'No source could play this';
    el('cm-pl-load-s').innerHTML = (why.length
        ? 'What each source said: <br>' + why.map(function (w) { return '&bull; ' + esc(w); }).join('<br>')
        : 'Every provider and mirror was tried.') +
        '<br><br>Sources change constantly; one that is dead today often works tomorrow.';
    /* The escape hatch a visitor reaches for when an embed will not frame: the
       provider's own page, opened outside the relay. */
    var nt = el('cm-pl-newtab');
    nt.href = currentRawUrl() || '#';
    nt.hidden = !nt.href || nt.href === '#';
    el('cm-pl-act').hidden = false;
    toast('No source could play this title', 'err', 4200);
}
function startProgress() {
    clearInterval(PLAY.tick);
    savePlayProgress(false);
    PLAY.tick = setInterval(function () {
        if (!PLAY.ctx || !PLAY.loaded) return;
        savePlayProgress(false);
        if (SETTINGS.autoplayNext && PLAY.ctx.type === 'tv' && playRuntimeMin() && elapsedMin() >= playRuntimeMin() - 0.8) {
            toast('Next episode starting\u2026', 'ok', 1800);
            step(1);
        }
    }, 20000);
}
function playRuntimeMin() {
    var c = PLAY.ctx;
    if (!c) return 0;
    if (c.type === 'movie') return (c.item.raw && c.item.raw.runtime) || 0;
    var eps = PLAY.episodes || [];
    var ep = eps.filter(function (e) { return Number(e.episode_number) === Number(c.episode); })[0];
    return (ep && ep.runtime) || (c.item.raw && c.item.raw.episode_run_time && c.item.raw.episode_run_time[0]) || 0;
}
function elapsedMin() { return PLAY.startedAt ? (Date.now() - PLAY.startedAt) / 60000 : 0; }
function savePlayProgress(final) {
    var c = PLAY.ctx;
    if (!c || c.trailer || !PLAY.startedAt) return;
    var total = playRuntimeMin();
    var pct = total ? clamp(elapsedMin() / total, 0, 1) : 0;
    if (!total && !final) return;
    setProgress(c.type, c.item.id, {
        pct: pct,
        season: c.season || 1,
        episode: c.episode || 1,
        item: slim(c.item)
    });
}
function step(dir) {
    var c = PLAY.ctx;
    if (!c || c.trailer || c.type !== 'tv') return;
    var max = (PLAY.episodes || []).length || 0;
    var next = Number(c.episode || 1) + dir;
    if (next < 1) return;
    if (max && next > max) {
        if (dir > 0) { toast('Last episode of this season - pick the next season from the title page', 'warn', 3400); }
        return;
    }
    c.episode = next;
    PLAY.startedAt = 0;
    renderPlayerChrome();
    markStrip();
    loadCurrent();
}
PLAY.step = step;
function markStrip() {
    var box = el('cm-pl-eps');
    if (!box || !PLAY.ctx) return;
    box.querySelectorAll('[data-ep]').forEach(function (b) {
        b.classList.toggle('is-on', Number(b.dataset.ep) === Number(PLAY.ctx.episode));
    });
}
function renderEpisodeStrip() {
    var box = el('cm-pl-eps');
    var c = PLAY.ctx;
    box.innerHTML = '';
    if (!c || c.trailer || c.type !== 'tv') return;
    var have = PLAY.episodes || [];
    function paint(eps) {
        PLAY.episodes = eps;
        box.innerHTML = eps.map(function (e) {
            return '<button class="cm-pl-ep' + (Number(e.episode_number) === Number(c.episode) ? ' is-on' : '') + '" type="button" data-ep="' + e.episode_number + '">' +
                e.episode_number + '. ' + esc(e.name || 'Episode ' + e.episode_number) + '</button>';
        }).join('');
        box.querySelectorAll('[data-ep]').forEach(function (b) {
            b.addEventListener('click', function () {
                PLAY.ctx.episode = Number(b.dataset.ep);
                PLAY.startedAt = 0;
                renderPlayerChrome();
                markStrip();
                loadCurrent();
            });
        });
    }
    if (have.length) { paint(have); return; }
    tmdb('tv/' + c.item.id + '/season/' + (c.season || 1), null, 300000)
        .then(function (s) { paint(s.episodes || []); })
        .catch(function () { box.innerHTML = ''; });
}
function providerMenu() {
    var items = [{ label: 'Sources', header: true }];
    PLAY.order.forEach(function (p) {
        items.push({
            label: p.name, note: p.note, on: p.id === currentProvider().id,
            run: function () {
                PLAY.pIdx = PLAY.order.findIndex(function (x) { return x.id === p.id; });
                PLAY.mIdx = 0;
                PLAY.triedDirect = false;
                updateProviderLabel();
                loadCurrent();
            }
        });
    });
    items.push({ label: 'Connection', header: true });
    items.push({
        label: 'Through the relay', note: 'recommended', on: PLAY.mode === 'proxy',
        run: function () { PLAY.mode = 'proxy'; PLAY.mIdx = 0; updateProviderLabel(); loadCurrent(); toast('Routing through the relay', 'ok'); }
    });
    items.push({
        label: 'Direct connection', on: PLAY.mode === 'direct',
        run: function () { PLAY.mode = 'direct'; PLAY.mIdx = 0; updateProviderLabel(); loadCurrent(); toast('Direct connection - blocks can apply', 'warn'); }
    });
    items.push({
        label: 'First source again',
        run: function () { PLAY.pIdx = 0; PLAY.mIdx = 0; PLAY.mode = SETTINGS.proxy ? 'proxy' : 'direct'; PLAY.triedDirect = false; updateProviderLabel(); loadCurrent(); }
    });
    return items;
}
function moreMenu() {
    return [
        { label: 'Open the raw source in a new tab', run: function () { window.open(currentRawUrl(), '_blank', 'noopener'); } },
        { label: 'Copy relay link', run: function () { copyText(currentDisplayUrl(), 'Relay link copied'); } },
        { label: 'Copy direct link', run: function () { copyText(currentRawUrl(), 'Direct link copied'); } },
        { label: 'Fullscreen', run: toggleFullscreen },
        { label: 'Back to the title', run: function () { var c = PLAY.ctx; closePlayer(); if (c) openDetail(c.type, c.item.id); } }
    ];
}
function toggleFullscreen() {
    var node = el('cm-player');
    try {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (node.requestFullscreen) node.requestFullscreen();
    } catch (e) { /* ignore */ }
}
function resolveAndPlay(type, id, provider, query) {
    if (provider && providerById(provider)) { SETTINGS.source = provider; saveSettings(); }
    tmdb(type + '/' + id, null, 60000).then(function (d) {
        var it = norm(d, type);
        it.raw = d;
        if (!GENRES[type]) GENRES[type] = {};
        (d.genres || []).forEach(function (g) { GENRES[type][g.id] = g.name; });
        it.genres = (d.genres || []).map(function (g) { return g.id; });
        keepLoaded([it]);
        SETTINGS.source = providerById(provider) ? provider : SETTINGS.source;
        openPlayer({
            item: it, type: type,
            season: Number((query && query.s) || 1),
            episode: Number((query && query.e) || 1)
        });
    }).catch(function () { toast('That title could not be loaded', 'err'); });
}

/* ---------------------------------------------------------------- wire-up */
el('cm-pl-back').addEventListener('click', closePlayer);
el('cm-pl-reload').addEventListener('click', loadCurrent);
el('cm-pl-retry').addEventListener('click', function () {
    /* Re-run the whole chain from the top and forget what each source said
       last time: providers break and recover by the hour, and a visitor who
       asks again deserves a clean attempt rather than a cached verdict. */
    if (!PLAY.ctx) return;
    PLAY.pIdx = 0;
    PLAY.mIdx = 0;
    PLAY.fails = {};
    PLAY.lastReason = '';
    PLAY.relayFailed = false;
    PLAY.triedDirect = false;
    PLAY.mode = SETTINGS.proxy ? 'proxy' : 'direct';
    updateProviderLabel();
    loadCurrent();
});
el('cm-pl-fs').addEventListener('click', toggleFullscreen);
el('cm-pl-prov').addEventListener('click', function () { openMenu(this, providerMenu(), false); });
el('cm-pl-more').addEventListener('click', function () { openMenu(this, moreMenu(), true); });
document.addEventListener('fullscreenchange', function () {
    el('cm-pl-fs').classList.toggle('is-on', !!document.fullscreenElement);
});
var origRenderChrome = renderPlayerChrome;
renderPlayerChrome = function () { origRenderChrome(); renderEpisodeStrip(); };

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
updateRelayBtn();
})();
</script>
</body>

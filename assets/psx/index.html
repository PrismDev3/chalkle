<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PlayStation Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { width: 100vw; height: 100vh; }
  #boot { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
          justify-content: center; gap: 14px; text-align: center; padding: 24px; box-sizing: border-box;
          background: #000; color: #fff; font-family: Arial, sans-serif; }
  #boot h1 { margin: 0; font-size: 20px; }
  #boot p { margin: 0; font-size: 14px; color: #aaa; max-width: 480px; line-height: 1.5; }
  #pick { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 8px;
          border: 1px solid #ff3d81; background: rgba(255,61,129,0.12); color: #ff6b9f;
          font-size: 15px; font-weight: 600; cursor: pointer; }
  #pick:hover { background: rgba(255,61,129,0.22); }
  #bar { width: min(360px, 80vw); height: 6px; border-radius: 3px; background: #2a2a2a; overflow: hidden; display: none; }
  #fill { height: 100%; width: 0%; background: #ff3d81; }
</style>
</head>
<body>
<div id="boot">
  <h1 id="title">PlayStation</h1>
  <p id="status">Loading&hellip;</p>
  <button id="pick" type="button" style="display:none">Choose game files</button>
  <input id="file" type="file" accept=".bin,.cue,.iso,.img" style="display:none">
  <div id="bar"><div id="fill"></div></div>
</div>
<div id="game"></div>

<script>
(function () {
  "use strict";
  var bootEl = document.getElementById("boot");
  var statusEl = document.getElementById("status");
  var pickBtn = document.getElementById("pick");
  var fileInput = document.getElementById("file");

  var OFFLINE = window.__EJS_OFFLINE__ || null;
  var singleFile = location.protocol === "data:";
  var CDN = "https://cdn.emulatorjs.org/stable/data/";
  var LOCAL = "/assets/emulatorjs/";

  /* Built-in disc, served from the site when present (the user's machine
     hosts it; GitHub Pages mirrors fall back to the file picker). */
  var BUILTIN = {
    "backyard-soccer": {
      cue: "/assets/games/psx/backyard-soccer.cue",
      files: { "Backyard Soccer (USA).bin": "/assets/games/psx/backyard-soccer.bin" }
    }
  };

  function showPicker(msg) {
    statusEl.textContent = msg;
    pickBtn.style.display = "inline-flex";
  }

  function boot(cueUrl, binRef) {
    window.EJS_player = "#game";
    window.EJS_core = "psx";
    window.EJS_gameUrl = cueUrl;
    window.EJS_language = "en";
    window.EJS_startOnLoaded = true;
    window.EJS_oldGUI = false;
    window.EJS_pathtodata = OFFLINE ? CDN : (singleFile ? CDN : LOCAL);
    window.EJS_defaultOptions = { volume: 0.6, saveStateSlot: 0 };
    /* Conservative settings: Chromebook GPUs / school networks frequently
       fail on WebGL2 + threaded cores, which manifests as a black screen
       while audio plays. Force the legacy (WebGL1, non-threaded) builds. */
    window.EJS_forceLegacyCores = true;
    window.EJS_threads = false;
    window.EJS_externalFiles = {};
    window.EJS_externalFiles[binRef.name] = binRef.url;
    if (OFFLINE) {
      window.EJS_paths = OFFLINE.paths;
      window.EJS_filePaths = OFFLINE.filePaths;
    }

    statusEl.textContent = "Loading emulator and disc...";
    pickBtn.style.display = "none";
    document.getElementById("bar").style.display = "block";

    if (typeof window.__EJS_LOADER__ === "function") {
      window.__EJS_LOADER__();
    } else {
      var loader = document.createElement("script");
      loader.src = (singleFile && !OFFLINE) ? CDN + "loader.js" : LOCAL + "loader.js";
      document.body.appendChild(loader);
    }
  }

  /* Auto-run a built-in disc if the site serves it. */
  function tryBuiltin(game) {
    var entry = BUILTIN[game];
    if (!entry) return false;
    fetch(entry.cue, { method: "HEAD" }).then(function (r) {
      if (!r.ok) throw new Error("cue not hosted");
      return fetch(entry.cue).then(function (r2) { return r2.text(); });
    }).then(function (cueText) {
      var m = cueText.match(/FILE\s+"([^"]+)"/i) || cueText.match(/FILE\s+(\S+)/i);
      var binName = (m && m[1]) || "disc.bin";
      boot(entry.cue, { name: binName, url: entry.files[binName] || Object.values(entry.files)[0] });
    }).catch(function () {
      showPicker("Pick this game's disc files (.bin + .cue) to play right now. Nothing is uploaded and nothing is stored online.");
    });
    return true;
  }

  var params = new URLSearchParams(location.search);
  var autoGame = (params.get("game") || "").trim();
  if (autoGame && tryBuiltin(autoGame)) {
    /* boot overlay stays up; EJS takes over when ready */
  }

  function onFile(file) {
    var name = (file.name || "disc.bin").toUpperCase();
    if (/\.(CUE)$/.test(name)) {
      var reader = new FileReader();
      reader.onload = function () {
        var cue = String(reader.result || "");
        var m = cue.match(/FILE\s+"([^"]+)"/i) || cue.match(/FILE\s+(\S+)/i);
        var binName = (m && m[1]) || "disc.bin";
        var cueUrl = "data:application/x-cue;charset=utf-8," + encodeURIComponent(cue);
        boot(cueUrl, { name: binName, url: URL.createObjectURL(file) });
      };
      reader.readAsText(file);
      return;
    }
    var base = name.replace(/\.[A-Z0-9]+$/, "");
    var cueText = 'FILE "' + base + '.BIN" BINARY\n  TRACK 01 MODE2/2352\n    INDEX 01 00:00:00\n';
    var cueUrl = "data:application/x-cue;charset=utf-8," + encodeURIComponent(cueText);
    boot(cueUrl, { name: base + ".BIN", url: URL.createObjectURL(file) });
  }

  pickBtn.addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () {
    if (fileInput.files && fileInput.files[0]) onFile(fileInput.files[0]);
  });
  document.addEventListener("dragover", function (e) { e.preventDefault(); });
  document.addEventListener("drop", function (e) {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0]);
  });
})();
</script>
</body>
</html>
